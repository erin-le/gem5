---

name: Run Test Failure Doctor GitHub agentic workflow on test failure

on:
    workflow_dispatch:
    workflow_run:
        workflows: [Daily Tests, Weekly Tests, Compiler Tests, CI Tests]
        types: [completed]


env:
  # This is the token used to authenticate with GitHub.
  # It is required to run the `gh` CLI.
    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
    run_workflows:
        permissions:
            actions: write
            contents: read
        runs-on: ubuntu-24.04
        steps:
            # This step is necessary to allow the `gh` CLI to be used in the
            # following steps. The `gh` CLI is used to trigger the workflows.
            # and needs to be used inside a the same repository where the
            # workflows are defined.
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Test Failure Doctor
              if: |
                  (github.event.workflow_run.conclusion == 'failure' ||
                  github.event.workflow_run.conclusion == 'timed_out') && !(github.event.workflow_run.run_attempt > 1)
              run: |
                  GH_DEBUG=api gh aw run test-failure-doctor --ref github-agentic-workflow
                  echo "Test failure doctor scheduled to run on github-agentic-workflow branch"
